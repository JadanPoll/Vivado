name: Contract-Oriented System Exploration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/system_behavior_model.py'
      - 'tests/source_contract_guards.py'
      - 'FINAL/index.html'
      - 'PRODUCTION_GRADE/ftdi-jtag.js'
      - 'PRODUCTION_GRADE/DEFAULTS/stopwatch/top.v'
      - 'PRODUCTION_GRADE/DEFAULTS/stopwatch/top.xdc'
      - '.github/workflows/system-behavior.yml'
jobs:
  behavioral-enumeration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify implementation retains model-derived contract fixes
        run: python3 tests/source_contract_guards.py
      - name: Enumerate behaviors and check real contracts
        run: python3 tests/system_behavior_model.py --depth 10
      - name: Generate pairwise audit and shortest traces
        run: python3 tests/system_behavior_model.py --depth 10 --report > system-behavior-audit.md
      - name: Save counterexamples and legal behaviors
        run: python3 tests/system_behavior_model.py --depth 10 --json > system-behavior-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system-behavior-results
          path: |
            system-behavior-results.json
            system-behavior-audit.md
