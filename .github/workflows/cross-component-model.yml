name: Cross-Component State Exploration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/system_model_v2.py'
      - '.github/workflows/cross-component-model.yml'
jobs:
  abstract-model:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Explore reachable states
        run: python3 tests/system_model_v2.py --depth 11
      - name: Save counterexamples and coverage
        run: python3 tests/system_model_v2.py --depth 11 --json > model-v2-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-v2-results
          path: model-v2-results.json
