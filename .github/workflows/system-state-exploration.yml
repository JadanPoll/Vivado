name: System State Exploration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/system_state_explorer.py'
      - '.github/workflows/system-state-exploration.yml'
jobs:
  bounded-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enumerate reachable abstract states and counterexamples
        run: python3 tests/system_state_explorer.py --depth 8
      - name: Record machine-readable counterexamples
        run: python3 tests/system_state_explorer.py --depth 8 --json > system-state-counterexamples.json
      - uses: actions/upload-artifact@v4
        with:
          name: system-state-counterexamples
          path: system-state-counterexamples.json
